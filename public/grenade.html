<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EDF訓練③ 手榴弾チャレンジ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=M+PLUS+1p:wght@800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #07100a;
  color: #dff0d0;
  font-family: 'M PLUS 1p', sans-serif;
  font-weight: 800;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
  pointer-events: none;
  z-index: 9998;
}

.screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; }
.screen.active { display: flex; }

/* ===== GRENADE IMAGE ===== */
.grenade {
  position: relative;
  width: 90px;
  height: 150px;
  flex-shrink: 0;
}
/* 手榴弾本体画像（ピンあり/なしを切り替え） */
.grenade .g-img {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  z-index: 1;
}
/* 飛んでいくピン画像 */
.grenade .g-pin-img {
  position: absolute;
  top: 4px; left: 38%;
  width: 34px; height: auto;
  z-index: 3;
}

/* ===== ANIMATIONS ===== */
@keyframes pinFly {
  0%   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
  15%  { transform: translate(10px,-15px) scale(1.15) rotate(60deg); opacity: 1; }
  100% { transform: translate(160px,-120px) rotate(540deg) scale(0.3); opacity: 0; }
}
.g-pin-img.fly { animation: pinFly 0.75s ease-in forwards; }

@keyframes grenadeShake {
  0%,100% { transform: rotate(0deg) translate(0,0); }
  15%     { transform: rotate(-4deg) translate(-3px,1px); }
  30%     { transform: rotate(4deg) translate(3px,-1px); }
  45%     { transform: rotate(-3deg) translate(-2px,1px); }
  60%     { transform: rotate(3deg) translate(2px,-1px); }
  75%     { transform: rotate(-4deg) translate(-3px,0); }
  90%     { transform: rotate(4deg) translate(3px,0); }
}
@keyframes grenadeUrgent {
  0%,100% { filter: drop-shadow(0 0 6px rgba(255,80,0,0.4)); }
  50%     { filter: drop-shadow(0 0 22px rgba(255,60,0,0.9)); }
}
@keyframes grenadeThrow {
  0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
  100% { transform: translate(120vw, -40vh) rotate(900deg); opacity: 0.2; }
}
@keyframes grenadeReturn {
  0%   { transform: translate(120vw, -40vh) rotate(900deg); opacity: 0.6; }
  85%  { transform: translate(-6px, 4px) rotate(10deg); opacity: 1; }
  100% { transform: translate(0,0) rotate(0deg); opacity: 1; }
}
@keyframes countPop {
  0%   { transform: scale(2.2); opacity: 0; }
  20%  { transform: scale(1);   opacity: 1; }
  75%  { transform: scale(1);   opacity: 1; }
  100% { transform: scale(0.65); opacity: 0; }
}

/* ===== EXPLOSION (画像スプライト) ===== */
.exp-img {
  position: fixed;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 600;
  object-fit: contain;
}
@keyframes flashOut {
  0%   { opacity: 0.9; }
  100% { opacity: 0; }
}
.screen-flash {
  position: fixed; inset: 0;
  background: #fff;
  pointer-events: none;
  z-index: 700;
  animation: flashOut 0.45s ease-out forwards;
}

/* ===== START SCREEN ===== */
#screen-start {
  gap: 28px;
}
#start-bg {
  position: absolute; inset: 0;
  background: url('/top_bg.png') center center / cover no-repeat;
  z-index: 0;
}
#start-bg::after {
  content: ''; position: absolute; inset: 0;
  background: rgba(0,0,0,0.55);
}
#screen-start > *:not(#start-bg) { position: relative; z-index: 1; }

#logo-switcher {
  position: relative; width: 200px; height: 80px;
}
#logo-switcher img {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; object-fit: contain;
  opacity: 0; transition: opacity 0.6s ease;
  filter: drop-shadow(0 2px 16px rgba(0,0,0,0.8));
}
#logo-switcher img.active { opacity: 1; }

#top-title { text-align: center; }
#top-title h1 {
  font-size: 42px; letter-spacing: 6px; color: #c8a832;
  text-shadow: 0 2px 20px rgba(0,0,0,0.9); line-height: 1.2;
}
#top-title .sub-en {
  display: block; margin-top: 8px;
  font-size: 13px; letter-spacing: 4px; color: rgba(200,168,50,0.8);
}
.top-desc {
  text-align: center;
  font-size: 18px; letter-spacing: 3px; color: #dff0d0;
  text-shadow: 0 1px 10px rgba(0,0,0,0.9); line-height: 1.8;
}
.top-desc-en {
  display: block; margin-top: 8px;
  font-size: 11px; letter-spacing: 3px; color: rgba(200,168,50,0.8);
}
@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
#press-hint { text-align: center; line-height: 1.9; }
#press-hint .hint-ja {
  display: block; font-size: 15px; letter-spacing: 3px; color: #dff0d0;
  text-shadow: 0 0 10px rgba(136,255,85,0.5);
  animation: blink 1.1s ease-in-out infinite;
}
#press-hint .hint-en {
  display: block; font-family: 'Orbitron', sans-serif;
  font-size: 10px; letter-spacing: 3px; color: rgba(136,255,85,0.7);
  animation: blink 1.1s ease-in-out infinite; animation-delay: 0.05s;
}
#start-btn {
  background: none; border: none; cursor: pointer; padding: 0;
  filter: drop-shadow(0 0 16px rgba(136,255,85,0.6));
  transition: transform 0.15s, filter 0.15s;
}
#start-btn img { width: 110px; height: 110px; object-fit: contain; }
@keyframes btn-launch {
  0%   { transform: scale(1); }
  25%  { transform: scale(0.82); }
  60%  { transform: scale(1.18); }
  80%  { transform: scale(0.96); }
  100% { transform: scale(1); }
}
#start-btn.launching {
  animation: btn-launch 0.45s ease forwards;
  pointer-events: none;
}
#top-copyright {
  position: absolute; bottom: 10px; left: 0; right: 0;
  text-align: center; font-size: 8px; letter-spacing: 3px;
  color: rgba(200,240,160,0.6);
}

/* ===== PINPULL SCREEN ===== */
#screen-pinpull {
  background: radial-gradient(ellipse at center, #1c0c0c 0%, #0a0404 100%);
  gap: 22px; text-align: center;
}
#pp-label { font-family:'Orbitron',sans-serif; font-size:16px; letter-spacing:4px; color:#ff4444;
            text-shadow:0 0 18px rgba(255,50,50,0.9); }
#pp-count {
  font-family:'Orbitron',sans-serif; font-size:82px; font-weight:900; color:#fff;
  text-shadow:0 0 30px rgba(255,255,255,0.55); min-height:100px;
  display:flex; align-items:center; justify-content:center;
}
#pp-count.pop { animation: countPop 0.85s ease forwards; }

/* ===== GAME SCREEN ===== */
#screen-game {
  background: linear-gradient(rgba(10,4,4,0.55), rgba(8,2,2,0.7)), url('/grenade_bg.png') center center/cover no-repeat #080202;
  gap: 28px;
}
#game-top-label { font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:6px; color:rgba(255,90,40,0.7); text-shadow:0 0 10px rgba(0,0,0,0.9); }
#ring-wrap {
  display:flex; align-items:center; justify-content:center;
}
#game-grenade { position:relative; z-index:1; }
#btn-throw {
  font-family:'Orbitron',sans-serif;
  width:190px; height:190px; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, rgba(255,100,40,0.35), rgba(180,40,0,0.18));
  border:3px solid rgba(255,80,40,0.85); color:#ff6633;
  cursor:pointer;
  box-shadow:0 0 40px rgba(255,80,40,0.45), inset 0 0 28px rgba(255,50,0,0.18);
  transition:transform 0.08s, box-shadow 0.08s;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
#btn-throw:active { transform:scale(0.92); box-shadow:0 0 15px rgba(255,80,40,0.3); }
.throw-icon  { width:64px; height:64px; object-fit:contain; filter:drop-shadow(0 0 6px rgba(255,120,40,0.6)); }
.throw-label { font-size:20px; font-weight:900; letter-spacing:5px; }
#game-hint { font-size:12px; letter-spacing:3px; color:rgba(255,200,60,0.7); text-shadow:0 0 10px rgba(0,0,0,0.9); }

/* ===== RESULT SCREEN ===== */
#screen-result { background:url('/bg.png') center center/cover no-repeat; justify-content:flex-end; }
#screen-result::before { content:''; position:absolute; inset:0; background:rgba(0,0,0,0.48); }
#res-taisa { position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:center; align-items:flex-end; z-index:1; }
#res-taisa img { max-height:82vh; max-width:95vw; object-fit:contain; filter:drop-shadow(0 4px 32px rgba(0,0,0,0.7)); }
#res-content {
  position:relative; z-index:2; width:100%; padding:0 20px 40px;
  display:flex; flex-direction:column; align-items:flex-end; gap:14px;
}
#res-box {
  background:rgba(0,0,0,0.82); border:2px solid rgba(255,90,40,0.45);
  border-radius:8px; padding:14px 20px; text-align:center; width:100%;
}
#res-box.ok   { border-color:rgba(255,220,50,0.85); box-shadow:0 0 22px rgba(255,220,50,0.35); }
#res-box.fail { border-color:rgba(255,50,50,0.85);  box-shadow:0 0 22px rgba(255,50,50,0.3); }
.res-label { font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:4px; color:rgba(255,90,40,0.7); }
#res-box.ok   .res-label { color:rgba(255,220,50,0.85); }
#res-box.fail .res-label { color:rgba(255,70,70,0.85); }
.res-time { font-family:'Orbitron',sans-serif; font-size:42px; font-weight:900; color:#ff8855;
            text-shadow:0 0 18px rgba(255,100,40,0.6); }
#res-box.ok   .res-time { color:#ffd432; text-shadow:0 0 18px rgba(255,212,50,0.85); }
#res-box.fail .res-time { color:#ff4444; text-shadow:0 0 18px rgba(255,50,50,0.65); }
.res-unit { font-size:15px; color:rgba(255,90,40,0.6); }
#res-diff { font-size:13px; letter-spacing:2px; margin-top:4px; color:rgba(255,255,255,0.45); }
#res-msg { font-size:16px; letter-spacing:2px; color:#fff; text-align:right;
           line-height:1.85; white-space:pre-line; text-shadow:0 2px 8px rgba(0,0,0,0.85); min-height:56px; }
.res-btns { display:flex; flex-direction:column; gap:10px; width:100%; }
.res-btn { font-family:'M PLUS 1p',sans-serif; font-weight:800; font-size:15px; letter-spacing:3px;
           padding:16px; border-radius:6px; cursor:pointer; transition:transform 0.1s; }
.res-btn:active { transform:scale(0.97); }
.btn-share { background:rgba(136,255,85,0.14); border:2px solid rgba(136,255,85,0.7); color:#88ff55; }
.btn-retry { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.2); color:#aaa; }
.btn-hub   { background:transparent; border:1px solid rgba(255,255,255,0.14); color:#666; }
</style>
</head>
<body>

<!-- ===== START ===== -->
<div id="screen-start" class="screen active">
  <div id="start-bg"></div>

  <div id="logo-switcher">
    <img src="/logo3.png" alt="EDF 5" class="active">
    <img src="/logo2.png" alt="EDF 6">
    <img src="/logo1.png" alt="EDF 6.1">
  </div>

  <div id="top-title">
    <h1>投げ返せ！EDF！</h1>
    <span class="sub-en">THROW IT BACK!</span>
  </div>

  <div class="top-desc">
    <p>TRAINING 03</p>
    <p>5秒で投げろ！</p>
    <span class="top-desc-en">THROW IT BACK IN 5 SECONDS!</span>
  </div>

  <div id="press-hint">
    <span class="hint-ja">▼ ボタンを押せ ▼</span>
  </div>

  <button id="start-btn" aria-label="訓練開始">
    <img src="/mark.png" alt="START">
  </button>

  <div id="press-hint">
    <span class="hint-en">▲ PRESS THE BUTTON ▲</span>
  </div>

  <p id="top-copyright">© D3PUBLISHER INC. All rights reserved.</p>
</div>

<!-- ===== PIN PULL ===== -->
<div id="screen-pinpull" class="screen">
  <div id="pp-label">ピンが抜けた！！</div>
  <div class="grenade" id="pp-grenade" style="transform:scale(1.4)">
    <img class="g-img" id="pp-body" src="/grenade_pin.png" alt="手榴弾">
    <img class="g-pin-img" id="pp-pin" src="/pin.png" alt="ピン">
  </div>
  <div id="pp-count">3</div>
</div>

<!-- ===== GAME ===== -->
<div id="screen-game" class="screen">
  <div id="game-top-label">THROW AT 5 SECONDS</div>
  <div id="ring-wrap">
    <div class="grenade" id="game-grenade" style="width:120px;height:190px;">
      <img class="g-img" src="/grenade_nopin.png" alt="手榴弾">
    </div>
  </div>
  <button id="btn-throw">
    <img class="throw-icon" src="/throw_hand.png" alt="">
    <span class="throw-label">THROW!</span>
  </button>
  <div id="game-hint">5秒になったら投げろ！</div>
</div>

<!-- ===== RESULT ===== -->
<div id="screen-result" class="screen">
  <div id="res-taisa"><img src="/taisa.png" alt="大佐"></div>
  <div id="res-content">
    <div id="res-box">
      <div class="res-label" id="res-label">YOUR TIME</div>
      <div>
        <span class="res-time" id="res-time">0.000</span>
        <span class="res-unit"> 秒</span>
      </div>
      <div id="res-diff"></div>
    </div>
    <div id="res-msg"></div>
    <div class="res-btns">
      <button class="res-btn btn-share" id="btn-share">仲間に広める</button>
      <button class="res-btn btn-retry" id="btn-retry">引き続き訓練を行う</button>
      <button class="res-btn btn-hub"   id="btn-hub">別の訓練をする</button>
    </div>
  </div>
</div>

<script>
const CLEAR_MIN  = 4.5;
const CLEAR_MAX  = 5.5;
const TARGET     = 5.0;

let state      = 'idle';
let startTime  = null;
let resultSec  = 0;
let autoTimer  = null;

const $  = id => document.getElementById(id);
const qs = sel => document.querySelector(sel);

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* ===== AUDIO ===== */
let ac = null;
function getAC() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function beep(freq, dur, type='square', vol=0.2) {
  try {
    const a = getAC(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.start(); o.stop(a.currentTime + dur);
  } catch(e){}
}
function sndClick()      { beep(660, 0.08, 'sine'); }
function sndCount(last)  { beep(last ? 880 : 550, 0.15); }
function sndGo()         { beep(880, 0.22, 'sine'); }
function sndPinPull() {
  try {
    const a = getAC(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(1400, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(500, a.currentTime + 0.35);
    g.gain.setValueAtTime(0.28, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.4);
    o.start(); o.stop(a.currentTime + 0.4);
  } catch(e){}
}
function sndThrow() {
  try {
    const a = getAC(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(320, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(60, a.currentTime + 0.28);
    g.gain.setValueAtTime(0.22, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.3);
    o.start(); o.stop(a.currentTime + 0.3);
  } catch(e){}
}
function sndBoom() {
  try {
    const a = getAC();
    [[160, 30, 0.5, 0.65], [600, 100, 0.28, 0.3]].forEach(([f, f2, vol, dur]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, a.currentTime);
      o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur + 0.05);
      o.start(); o.stop(a.currentTime + dur + 0.1);
    });
  } catch(e){}
}
function sndClear() {
  try {
    const a = getAC();
    [0, 0.13, 0.26, 0.42].forEach((t, i) => {
      const freqs = [523, 659, 784, 1047];
      const o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.type = 'square';
      o.frequency.setValueAtTime(freqs[i], a.currentTime + t);
      g.gain.setValueAtTime(0.18, a.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + t + 0.28);
      o.start(a.currentTime + t); o.stop(a.currentTime + t + 0.3);
    });
  } catch(e){}
}

/* ===== SPEECH ===== */
function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const male = voices.find(v => v.lang.startsWith('ja') && /Otoya|男性|Male|otoya/i.test(v.name));
  if (male) { u.voice = male; u.pitch = 0.85; }
  else { u.pitch = 0.5; }
  speechSynthesis.speak(u);
}

/* ===== TYPEWRITER ===== */
function typeMsg(el, text, cb) {
  el.textContent = ''; let i = 0;
  const iv = setInterval(() => {
    el.textContent += text[i++];
    if (i >= text.length) { clearInterval(iv); if (cb) cb(); }
  }, 58);
}

/* ===== EXPLOSION (画像スプライトアニメ) ===== */
const EXP_FRAMES = ['/explosion_frame1.png', '/explosion_frame2.png', '/explosion_frame3.png'];
const EXP_FRAME_MS = 110;

function explode(cx, cy) {
  const x = cx ?? innerWidth / 2;
  const y = cy ?? innerHeight / 2;

  // screen flash
  const fl = document.createElement('div');
  fl.className = 'screen-flash';
  document.body.appendChild(fl);
  setTimeout(() => fl.remove(), 500);

  // 爆発スプライト: frame1→2→3を順再生しながら拡大
  const size = Math.min(innerWidth, innerHeight) * 0.9;
  const img = document.createElement('img');
  img.className = 'exp-img';
  img.src = EXP_FRAMES[0];
  img.style.left   = x + 'px';
  img.style.top    = y + 'px';
  img.style.width  = size + 'px';
  img.style.height = size + 'px';
  img.style.opacity = '1';
  document.body.appendChild(img);

  let fi = 0;
  const iv = setInterval(() => {
    fi++;
    if (fi < EXP_FRAMES.length) {
      img.src = EXP_FRAMES[fi];
    } else {
      clearInterval(iv);
      // 最終フレームでフェードアウト
      img.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
      img.style.transform = 'translate(-50%, -50%) scale(1.2)';
      img.style.opacity = '0';
      setTimeout(() => img.remove(), 550);
    }
  }, EXP_FRAME_MS);
}


/* ===== GAME FLOW ===== */
function startGame() {
  if (state !== 'idle') return;
  state = 'pinpull';
  sndClick();
  if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  showScreen('screen-pinpull');

  const pin = $('pp-pin');
  // 本体はピンあり画像で開始
  $('pp-body').src = '/grenade_pin.png';
  setTimeout(() => {
    pin.classList.add('fly');
    sndPinPull();
    // ピンが抜けたら本体をピンなし画像に切り替え
    $('pp-body').src = '/grenade_nopin.png';
  }, 350);

  const countEl = $('pp-count');
  let n = 3;

  function showCount(val) {
    countEl.classList.remove('pop');
    void countEl.offsetWidth;
    countEl.textContent = val;
    countEl.classList.add('pop');
  }

  showCount(3); sndCount(false);

  const iv = setInterval(() => {
    n--;
    if (n > 0) { showCount(n); sndCount(n === 1); }
    else {
      clearInterval(iv);
      showCount('GO!'); sndGo();
      setTimeout(() => {
        state = 'playing';
        showScreen('screen-game');
        // grenade shake + urgent glow
        const gr = $('game-grenade');
        gr.style.animation = 'grenadeShake 0.35s ease-in-out infinite, grenadeUrgent 0.5s ease-in-out infinite';
        startTime = performance.now();
        autoTimer = setTimeout(() => {
          if (state === 'playing') triggerThrow(true);
        }, CLEAR_MAX * 1000);
      }, 550);
    }
  }, 1000);
}

function triggerThrow(auto = false) {
  if (state !== 'playing') return;
  state = 'animating';
  clearTimeout(autoTimer);

  const elapsed = (performance.now() - startTime) / 1000;
  resultSec = Math.round(elapsed * 1000) / 1000;

  const gr = $('game-grenade');
  gr.style.animation = '';

  if (auto || resultSec >= CLEAR_MAX) {
    // LATE — explode in place
    gr.style.animation = 'grenadeShake 0.1s ease-in-out infinite';
    setTimeout(() => {
      gr.style.animation = '';
      gr.style.opacity = '0';
      sndBoom();
      const rect = gr.getBoundingClientRect();
      explode(rect.left + rect.width/2, rect.top + rect.height/2);
      setTimeout(() => showResult('late'), 1300);
    }, 280);

  } else if (resultSec < CLEAR_MIN) {
    // EARLY — throw, bounce back, explode
    sndThrow();
    gr.style.animation = 'grenadeThrow 0.62s ease-in forwards';
    setTimeout(() => {
      gr.style.animation = 'grenadeReturn 0.85s ease-out forwards';
      setTimeout(() => {
        gr.style.animation = '';
        gr.style.opacity = '0';
        sndBoom();
        const rect = gr.getBoundingClientRect();
        explode(innerWidth/2, innerHeight * 0.42);
        setTimeout(() => showResult('early'), 1300);
      }, 850);
    }, 680);

  } else {
    // SUCCESS — throw, far explosion
    sndThrow();
    gr.style.animation = 'grenadeThrow 0.62s ease-in forwards';
    setTimeout(() => {
      sndBoom();
      explode(innerWidth - 70, innerHeight * 0.3);
      setTimeout(() => { sndClear(); showResult('success'); }, 500);
    }, 700);
  }
}

function showResult(type) {
  state = 'result';

  const diff    = resultSec - TARGET;
  const diffStr = diff >= 0 ? `+${diff.toFixed(3)}秒` : `${diff.toFixed(3)}秒`;

  $('res-time').textContent = resultSec.toFixed(3);

  const box = $('res-box');
  box.className = type === 'success' ? 'ok' : 'fail';

  if (type === 'success') {
    $('res-label').textContent = 'MISSION CLEAR';
    $('res-diff').textContent  = `目標との差：${diffStr}`;
  } else if (type === 'early') {
    $('res-label').textContent = 'MISSION FAILED — 早すぎ';
    $('res-diff').textContent  = `${resultSec.toFixed(3)}秒 — あと${(TARGET - resultSec).toFixed(2)}秒待て`;
  } else {
    $('res-label').textContent = 'MISSION FAILED — 遅すぎ';
    $('res-diff').textContent  = '5秒を超えた…';
  }

  // reset grenade state for next play
  const gr = $('game-grenade');
  gr.style.animation = '';
  gr.style.opacity   = '1';
  gr.style.transform = '';

  showScreen('screen-result');

  const msgEl = $('res-msg');
  if (type === 'success') {
    typeMsg(msgEl, 'や...やるな...\nもう一度やってみろ！',
      () => speak('や・・・やるな・・・もう一度やってみろ！'));
  } else if (type === 'early') {
    typeMsg(msgEl, '早すぎる！\n手榴弾が戻ってきたぞ！\nこんなコトも出来ないのか！',
      () => speak('早すぎる！手榴弾が戻ってきたぞ！こんなことも出来ないのか！'));
  } else {
    typeMsg(msgEl, '遅すぎる！\nそこで爆発したぞ！\nもっと鍛えろ！',
      () => speak('遅すぎる！そこで爆発したぞ！もっと鍛えろ！'));
  }
}

function resetGame() {
  state = 'idle'; startTime = null; resultSec = 0;
  clearTimeout(autoTimer);
  $('pp-pin').classList.remove('fly');
  const gr = $('game-grenade');
  gr.style.animation = gr.style.opacity = gr.style.transform = '';
  $('pp-count').classList.remove('pop');
  $('pp-count').textContent = '3';
}

/* ===== EVENTS ===== */
function addTap(id, fn) {
  const el = $(id);
  el.addEventListener('click', fn);
  el.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, { passive: false });
}

// ===== LOGO SWITCHER =====
(function() {
  const logos = document.querySelectorAll('#logo-switcher img');
  let current = 0;
  setInterval(() => {
    logos[current].classList.remove('active');
    current = (current + 1) % logos.length;
    logos[current].classList.add('active');
  }, 2000);
})();

// ===== START BUTTON =====
const startBtn = $('start-btn');
function onStartPress() {
  if (state !== 'idle') return;
  sndClick();
  if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  startBtn.classList.add('launching');
  setTimeout(() => {
    startBtn.classList.remove('launching');
    startGame();
  }, 450);
}
startBtn.addEventListener('click', onStartPress);
startBtn.addEventListener('touchend', e => { e.preventDefault(); onStartPress(); }, { passive: false });

addTap('btn-throw', () => triggerThrow());
addTap('btn-share', () => {
  sndClick();
  const txt = `TGS2026 D3P ブース番号：◯◯ で地球防衛軍の訓練中！集合しろ！${resultSec.toFixed(3)}秒達成！（目標5.000秒） #EDF訓練 #TGS2026`;
  if (navigator.share) navigator.share({ text: txt });
  else { navigator.clipboard.writeText(txt).catch(()=>{}); alert('クリップボードにコピーしました！'); }
});
addTap('btn-retry', () => { sndClick(); resetGame(); showScreen('screen-start'); });
addTap('btn-hub',   () => { sndClick(); location.href = '/'; });
</script>
</body>
