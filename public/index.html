<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>D3P 黙認 EDF 訓練プログラム</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=M+PLUS+1p:wght@800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #07100a;
  color: #dff0d0;
  font-family: 'M PLUS 1p', sans-serif;
  font-weight: 800;
  overflow: hidden;
  touch-action: manipulation;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
  pointer-events: none;
  z-index: 999;
}

#bg {
  position: fixed; inset: 0;
  background: url('/top_bg.png') center/cover no-repeat;
  z-index: 0;
}
#bg::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.65);
}

#main {
  position: fixed; inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 24px 20px 32px;
}

/* ヘッダー */
.header {
  width: 100%;
  text-align: center;
}
.header-d3p {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 5px;
  color: #ffdd44;
  text-shadow: 0 0 10px rgba(255,221,68,0.5);
  margin-bottom: 4px;
}
.header-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 5px;
  color: rgba(136,255,85,0.7);
  margin-bottom: 4px;
}
.header-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 4px;
  color: #fff;
  text-shadow: 0 0 20px rgba(136,255,85,0.4);
}
.header-sub {
  font-size: 11px;
  letter-spacing: 3px;
  color: rgba(136,255,85,0.5);
  margin-top: 4px;
}

/* 大佐の身長を固定変数化（画像サイズと吹き出し位置の両方がこの値だけを参照する） */
:root {
  --taisa-h: clamp(300px, calc(100vh - 330px), 520px);
}

/* 大佐（絶対配置・中央下） */
#taisa-img {
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  height: var(--taisa-h);
  object-fit: contain;
  z-index: 1;
  filter: drop-shadow(0 0 16px rgba(136,255,85,0.3));
}

/* 大佐エリア（レイアウト上のスペーサーとしてのみ機能） */
.taisa-area {
  flex: 1;
  width: 100%;
  min-height: 0;
}

/* 吹き出し：大佐の身長(--taisa-h)から直接位置を算出し、頭の上に固定 */
.speech-bubble {
  position: absolute;
  bottom: calc(var(--taisa-h) + 10px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  border: 2px solid rgba(136,255,85,0.6);
  border-radius: 12px;
  padding: 12px 18px;
  max-width: 220px;
  text-align: center;
  z-index: 2;
}
.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -12px; left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: rgba(136,255,85,0.6);
}
.speech-main {
  font-size: 16px;
  letter-spacing: 2px;
  color: #fff;
  line-height: 1.7;
  white-space: nowrap;
}
.speech-sub {
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(136,255,85,0.8);
  margin-top: 4px;
}

/* アクセスカウンター */
#counter-box {
  width: 100%;
  padding: 10px 16px;
  text-align: center;
  position: relative;
  z-index: 2;
  margin-bottom: 4px;
}
#counter-main {
  font-size: 15px;
  letter-spacing: 2px;
  color: #fff;
  line-height: 1.6;
}
#counter-num {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: #88ff55;
  text-shadow: 0 0 12px rgba(136,255,85,0.6);
}
#counter-sub {
  font-size: 10px;
  letter-spacing: 1px;
  color: rgba(136,255,85,0.5);
  margin-top: 2px;
}

/* 訓練ボタン */
.training-list {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  z-index: 2;
}
.training-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(0,20,0,0.8);
  border: 2px solid rgba(136,255,85,0.35);
  border-radius: 8px;
  padding: 14px 18px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.training-btn:active {
  background: rgba(136,255,85,0.1);
  border-color: rgba(136,255,85,0.8);
}
/* 起動前: ボタン無効化 */
.training-list.locked .training-btn {
  opacity: 0.35;
  pointer-events: none;
  filter: grayscale(0.6);
}
/* 起動ステータス表示（最前面・画面中央固定） */
#boot-status {
  position: fixed;
  top: 45%; left: 50%;
  transform: translate(-50%, calc(-50% - 1.5vh));
  width: 90%;
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #88ff55;
  text-shadow: 0 0 16px rgba(0,0,0,1), 0 0 24px rgba(136,255,85,0.6);
  z-index: 99999;
  pointer-events: none;
  animation: boot-blink 1.1s ease-in-out infinite;
}
#boot-status.done { display: none; }
@keyframes boot-blink { 0%,49%{opacity:1} 50%,100%{opacity:0.3} }
.training-num {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: rgba(136,255,85,0.8);
  min-width: 72px;
  text-align: center;
}
.training-info { flex: 1; min-width: 0; }
.training-name {
  font-size: 16px;
  letter-spacing: 2px;
  color: #fff;
}
.training-desc {
  font-size: 11px;
  letter-spacing: 1px;
  color: rgba(136,255,85,0.5);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
}
.training-time {
  font-size: 9px;
  letter-spacing: 1px;
  color: rgba(255,221,68,0.7);
  margin-top: 3px;
}
.training-arrow {
  font-size: 18px;
  color: rgba(136,255,85,0.5);
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="main">

  <div class="header">
    <div class="header-d3p">D3P 黙認</div>
    <div class="header-label">EARTH DEFENSE FORCE</div>
    <div class="header-title">EDF 訓練プログラム</div>
    <div class="header-sub">TRAINING SYSTEM V1.0</div>
  </div>

  <img id="taisa-img" src="/taisa.png" alt="大佐">

  <div class="taisa-area">
    <div class="speech-bubble">
      <div class="speech-main">集合しろ！クズども！並べ！</div>
      <div class="speech-sub">待機の間も訓練を怠るな！</div>
    </div>
  </div>

  <div id="counter-box">
    <div id="counter-main">現状の訓練生は <span id="counter-num">…</span> 人だ！</div>
    <div id="counter-sub"><span id="counter-milestone">10,000</span>人突破で物資補給させてやる！</div>
  </div>

  <div id="boot-status">起立！号令を待て…</div>

  <div class="training-list locked">
    <a class="training-btn" href="/frontline-held/">
      <div class="training-num">TRAINING-01</div>
      <div class="training-info">
        <div class="training-name">回避訓練</div>
        <div class="training-desc">迫り来る巨大生物を回避せよ！</div>
        <div class="training-time">所要時間 約3分</div>
      </div>
      <div class="training-arrow">▶</div>
    </a>
    <a class="training-btn" id="hidden-runner-btn" href="/runner.html" style="display:none;">
      <div class="training-num">TRAINING-00</div>
      <div class="training-info">
        <div class="training-name">回避訓練（旧）</div>
        <div class="training-desc">巨大蟻を避けて突き進め！</div>
      </div>
      <div class="training-arrow">▶</div>
    </a>
    <a class="training-btn" href="/ant-smash.html">
      <div class="training-num">TRAINING-02</div>
      <div class="training-info">
        <div class="training-name">殲滅訓練</div>
        <div class="training-desc">制限時間内に蟻を殲滅せよ！</div>
        <div class="training-time">所要時間 30秒</div>
      </div>
      <div class="training-arrow">▶</div>
    </a>
    <a class="training-btn" href="/grenade.html">
      <div class="training-num">TRAINING-03</div>
      <div class="training-info">
        <div class="training-name">5秒感覚訓練</div>
        <div class="training-desc">手榴弾を投げ返せ！</div>
        <div class="training-time">所要時間 5秒</div>
      </div>
      <div class="training-arrow">▶</div>
    </a>
  </div>

</div>

<script>
// 文字を折り返さず、収まらない場合は縮小して1行に収める
function fitTextNoWrap(el, maxWidth) {
  if (!el) return;
  const target = maxWidth || el.clientWidth;
  let fontSize = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > target && fontSize > 8) {
    fontSize -= 0.5;
    el.style.fontSize = fontSize + 'px';
  }
}
// 大佐の身長を実測して、ヘッダー・吹き出し・訓練生カウンターが重ならないよう調整
// （大佐と吹き出しは画面下端からの距離(--taisa-h)を基準に位置が決まるため、
//   カウンター上端・ヘッダー下端それぞれを基準に許容範囲を逆算する）
function fitTaisaHeight() {
  const header = document.querySelector('.header');
  const counterBox = document.getElementById('counter-box');
  const bubble = document.querySelector('.speech-bubble');
  if (!header || !counterBox || !bubble) return;
  const vh = window.innerHeight;
  const headerBottom = header.getBoundingClientRect().bottom;
  const counterTop = counterBox.getBoundingClientRect().top;
  const bubbleH = bubble.offsetHeight;

  const minH = (vh - counterTop) + 24;             // 吹き出し下端をカウンター上端より上にするための最小値
  const maxH = (vh - headerBottom) - bubbleH - 26;  // 吹き出し上端をヘッダー下端より下にするための最大値

  let h = maxH >= minH ? maxH : minH;
  h = Math.max(220, Math.min(h, 560));
  document.documentElement.style.setProperty('--taisa-h', h + 'px');
}
window.addEventListener('load', () => {
  fitTextNoWrap(document.querySelector('.speech-main'), 184);
  document.querySelectorAll('.training-desc').forEach(el => fitTextNoWrap(el));
  fitTaisaHeight();
});
window.addEventListener('resize', fitTaisaHeight);

// アクセスカウンター
fetch('/api/counter', { method: 'POST' })
  .then(r => r.json())
  .then(d => {
    document.getElementById('counter-num').textContent = String(d.count).padStart(4, '0');
    document.getElementById('counter-milestone').textContent = d.milestone.toLocaleString('ja-JP');
  })
  .catch(() => {
    document.getElementById('counter-num').textContent = '----';
  });

// オフラインキャッシュ登録
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// 最初のタップでフルスクリーン化（ブラウザ仕様上、自動起動はできないため）
function enterFullscreenOnce() {
  document.removeEventListener('touchstart', enterFullscreenOnce);
  document.removeEventListener('click', enterFullscreenOnce);
  try {
    const el = document.documentElement;
    if (el.requestFullscreen)            el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch (e) {}
}
document.addEventListener('touchstart', enterFullscreenOnce, { once: true, passive: true });
document.addEventListener('click', enterFullscreenOnce, { once: true });

// ボタンクリック音
let audioCtx = null;
function playBtnClick() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.setValueAtTime(660, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
  } catch(e) {}
}
document.querySelectorAll('.training-btn').forEach(btn => {
  btn.addEventListener('click', () => playBtnClick());
  btn.addEventListener('touchstart', () => playBtnClick(), { passive: true });
});

// 隠しメニュー: 大佐を5回連続タップすると旧・回避訓練ボタンを表示
let taisaTapCount = 0;
let taisaTapTimer = null;
document.getElementById('taisa-img').addEventListener('click', () => {
  taisaTapCount++;
  clearTimeout(taisaTapTimer);
  taisaTapTimer = setTimeout(() => { taisaTapCount = 0; }, 2000);
  if (taisaTapCount >= 5) {
    taisaTapCount = 0;
    document.getElementById('hidden-runner-btn').style.display = '';
  }
});

// ===== 起動シーケンス: TOPページ + 殲滅訓練のアート読込 + タップでボタン解禁 =====
const ALL_ASSETS = [
  // TOPページ
  '/taisa.png', '/top_bg.png',
  // 殲滅訓練 (ant-smash)
  '/ant_bg.png', '/bg.png',
  '/logo1.png', '/logo2.png', '/logo3.png',
  '/mark.png',
  '/ant1.png', '/ant2.png', '/ant3.png', '/ant4.png',
  '/crush.png',
];

function preloadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = img.onerror = () => resolve();
    img.src = src;
  });
}

Promise.all(ALL_ASSETS.map(preloadImage)).then(() => {
  document.querySelector('.training-list').classList.remove('locked');
  document.getElementById('boot-status').classList.add('done');
});
</script>
</body>
</html>
